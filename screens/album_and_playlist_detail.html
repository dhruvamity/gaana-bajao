<span class="material-symbols-outlined text-[16px]">album</span>
                    LP Release
                </div>

<div class="w-6 h-6 rounded-full bg-surface-container overflow-hidden border border-primary/20">

<div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-primary/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                        Add to Library
                    </button>
<button class="w-12 h-12 rounded-full border border-primary/10 bg-surface/40 backdrop-blur-md flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-dim hover:border-primary/30 transition-colors active:scale-95 border-primary/20">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</div>

<span class="material-symbols-outlined text-lg">favorite</span>
</button>
<span class="">4:12</span>
</div>
</div>

<div class="w-8 text-center text-primary hidden group-hover:flex justify-center items-center">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<div class="flex-1 flex flex-col pl-2">
<span class="text-sm font-medium text-on-surface group-hover:text-primary transition-colors">Subzero Resonance</span>
<span class="text-xs text-on-surface-variant">Kaelen</span>
</div>
<div class="w-16 flex items-center justify-end gap-3 text-sm text-on-surface-variant">

</div>
</div>
</div>
